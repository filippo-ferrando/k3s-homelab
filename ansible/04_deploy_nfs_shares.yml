---
- name: Install NFS utilities on all nodes
  hosts: k3s_cluster
  become: true
  tasks:
    - name: Install nfs-utils package
      ansible.builtin.dnf:
        name: nfs-utils
        state: present

- name: Open NFS ports
  hosts: nfs_storage
  become: true
  tasks:
    - name: Open NFS ports in the public zone
      ansible.posix.firewalld:
        zone: public
        service: "{{ item }}"
        permanent: true
        immediate: true
        state: enabled
      loop:
        - nfs
        - rpc-bind
        - mountd
      when: ansible_facts.services['firewalld.service'] is defined and
        ansible_facts.services['firewalld.service'].state == 'running'

- name: Setup NFS export on Casper
  hosts: nfs_storage
  become: true
  vars:
    nfs_exports:
      # mount on all swarm
      - path: "/mnt/vault/git" #CHANGE THIS!!!
        allowed_ips:
          - "192.168.10.102"
          - "192.168.10.103"
        options: "rw,sync,no_subtree_check,no_root_squash"
      # mount on all swarm
      - path: "/mnt/vault/data"
        allowed_ips:
          - "192.168.10.102"
          - "192.168.10.103"
        options: "rw,sync,no_subtree_check,no_root_squash"
      # mount on all swarm
      - path: "/mnt/media"
        allowed_ips:
          - "192.168.10.102"
          - "192.168.10.103"
        options: "rw,sync,no_subtree_check,no_root_squash"
      # mount only on network machine
      - path: "/mnt/vault"
        allowed_ips:
          - "192.168.10.100"
        options: "ro,sync,no_subtree_check,no_root_squash"

  tasks:
    - name: Configure /etc/exports
      ansible.builtin.lineinfile:
        path: /etc/exports
        line: >-
          {{ item.path }}
          {% for ip in item.allowed_ips %}
          {{ ip }}({{ item.options }}){% if not loop.last %} {% endif %}
          {% endfor %}
        regexp: "^\\s*{{ item.path | regex_escape }}"
        create: true
        owner: root
        group: root
        mode: "0644"
      loop: "{{ nfs_exports }}"
      notify: Export NFS Share

    - name: Enable and start NFS server service
      ansible.builtin.systemd:
        name: nfs-server
        state: started
        enabled: true

  handlers:
    - name: Export NFS Share
      ansible.builtin.command: exportfs -rav

