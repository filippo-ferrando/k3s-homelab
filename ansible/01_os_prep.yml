---
- name: Prepare AlmaLinux 10 for K3s and Longhorn
  hosts: k3s_cluster
  become: true
  tasks:
    - name: Install required packages (NFS client and iSCSI for Longhorn)
      ansible.builtin.dnf:
        name:
          - nfs-utils
          - iscsi-initiator-utils
          - curl
          - tar
          - cockpit
          - cockpit-machines
          - cockpit-storaged
          - libvirt
        state: present

    # RHEL 10 link
    - name: Add the Tailscale repository
      ansible.builtin.yum_repository:
        name: tailscale
        description: Tailscale stable repo
        baseurl: https://pkgs.tailscale.com/stable/rhel/10/
        enabled: true
        gpgcheck: true
        gpgkey: https://pkgs.tailscale.com/stable/rhel/10/tailscale.asc

    - name: Install Tailscale
      ansible.builtin.dnf:
        name: tailscale
        state: present

    - name: Enable and start tailscaled service
      ansible.builtin.systemd:
        name: tailscaled
        enabled: true
        state: started

    - name: Enable and start iSCSI daemon (Required by Longhorn)
      ansible.builtin.systemd:
        name: iscsid
        state: started
        enabled: true

    - name: Configure Firewalld for K3s internal traffic
      ansible.posix.firewalld:
        zone: trusted
        source: "192.168.10.0/24"
        permanent: true
        immediate: true
        state: enabled
      when: ansible_facts.services['firewalld.service'] is defined
