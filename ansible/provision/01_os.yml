---
- name: Prepare AlmaLinux 10 for K3s and Longhorn
  hosts: k3s_cluster
  become: true
  tasks:
    - name: Full system update
      ansible.builtin.dnf:
        name: "*"
        state: latest

    - name: Install required packages
      ansible.builtin.dnf:
        name:
          - container-selinux
          - kernel-modules-extra
          - nfs-utils
          - iscsi-initiator-utils
          - curl
          - tar
          - cockpit
          - cockpit-machines
          - cockpit-storaged
          - libvirt
          - zram-generator
          - dnf-utils
          - epel-release
        state: present

    - name: Configure SELinux booleans for K3s and Longhorn
      ansible.posix.seboolean:
        name: "{{ item }}"
        state: true
        persistent: true
      loop:
        - container_use_devices
        - container_connect_any

    - name: Load required networking and nftables compatibility kernel modules
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - br_netfilter
        - overlay

    - name: Persist kernel modules across reboots
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k3s.conf
        content: |
          br_netfilter
          overlay
        mode: "0644"

    - name: Configure sysctl parameters for K3s networking
      ansible.posix.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        state: present
        sysctl_file: /etc/sysctl.d/99-k3s.conf
        reload: true
      loop:
        - { key: "net.bridge.bridge-nf-call-iptables", value: "1" }
        - { key: "net.bridge.bridge-nf-call-ip6tables", value: "1" }
        - { key: "net.ipv4.ip_forward", value: "1" }
        # RHEL defaults (128 instances) run out with Longhorn, Falco and log followers;
        # the kubelet then fails "kubectl logs -f" with "too many open files".
        - { key: "fs.inotify.max_user_instances", value: "8192" }
        - { key: "fs.inotify.max_user_watches", value: "524288" }

    - name: Configure zram device
      ansible.builtin.copy:
        dest: /etc/systemd/zram-generator.conf
        content: |
          [zram0]
          zram-size = ram / 2
          compression-algorithm = zstd
        mode: "0644"
      notify: Reload systemd and start zram

    - name: Enable and start iSCSI daemon (Required by Longhorn)
      ansible.builtin.systemd_service:
        name: iscsid
        state: started
        enabled: true

  handlers:
    - name: Reload systemd and start zram
      ansible.builtin.systemd_service:
        name: systemd-zram-setup@zram0
        state: restarted
        daemon_reload: true
