---
# Joining the tailnet (`tailscale up`) stays a manual, one-time step per node.
- name: Install and configure Tailscale
  hosts: k3s_cluster
  become: true
  tasks:
    - name: Add Tailscale repository
      ansible.builtin.get_url:
        url: https://pkgs.tailscale.com/stable/rhel/10/tailscale.repo
        dest: /etc/yum.repos.d/tailscale.repo
        mode: "0644"

    - name: Install Tailscale
      ansible.builtin.dnf:
        name: tailscale
        state: present

    - name: Enable and start tailscaled
      ansible.builtin.systemd_service:
        name: tailscaled
        state: started
        enabled: true

    - name: Read current Tailscale prefs
      ansible.builtin.command: tailscale debug prefs
      register: tailscale_prefs_raw
      changed_when: false
      check_mode: false

    - name: Parse Tailscale prefs
      ansible.builtin.set_fact:
        tailscale_prefs: "{{ tailscale_prefs_raw.stdout | from_json }}"

    - name: Enable Tailscale SSH
      ansible.builtin.command: tailscale set --ssh=true
      when: not tailscale_prefs.RunSSH
      changed_when: true

    - name: Set local OS user as Tailscale operator
      ansible.builtin.command: "tailscale set --operator={{ ansible_user }}"
      when: tailscale_prefs.OperatorUser != ansible_user
      changed_when: true

    # firewalld owns the firewall (provision/02_firewall.yml trusts tailscale0); 0 = off
    - name: Stop Tailscale from managing netfilter
      ansible.builtin.command: tailscale set --netfilter-mode=off
      when: tailscale_prefs.NetfilterMode != 0
      changed_when: true
