---
- name: Patch Host Operating Systems
  hosts: k3s_cluster
  become: true
  tasks:
    - name: Run full DNF package update
      ansible.builtin.dnf:
        name: "*"
        state: latest

    - name: Check if reboot is required
      ansible.builtin.command: needs-restarting -r
      register: reboot_check
      failed_when: false
      changed_when: false
      check_mode: false

    - name: Flag host for Kured reboot
      ansible.builtin.copy:
        dest: /var/run/reboot-required
        content: ""
        mode: "0644"
      when: reboot_check.rc == 1
