# Gives /dev/kmsg to the lastgasp agent as the devic.es/kmsg resource, so the agent
# does not need to run privileged. Based on the upstream manifest of the same version.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: generic-device-plugin
  namespace: kube-system
  labels:
    app.kubernetes.io/name: generic-device-plugin
  annotations:
    # Before lastgasp (wave 5), so the resource exists when the agents start
    argocd.argoproj.io/sync-wave: "-2"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: generic-device-plugin
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: generic-device-plugin
    spec:
      priorityClassName: system-node-critical
      automountServiceAccountToken: false
      tolerations:
        - operator: Exists
      containers:
        - name: generic-device-plugin
          image: ghcr.io/squat/generic-device-plugin:0.2.0
          args:
            - --device
            - '{"name": "kmsg", "groups": [{"paths": [{"path": "/dev/kmsg"}]}]}'
          resources:
            requests:
              cpu: 10m
              memory: 10Mi
            limits:
              memory: 20Mi
          # Needs the host /dev and the kubelet plugin socket
          securityContext:
            privileged: true
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: dev
              mountPath: /dev
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: dev
          hostPath:
            path: /dev
