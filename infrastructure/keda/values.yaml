# Operator metrics (keda_scaler_metrics_value, keda_scaler_errors_total, ...) for the
# "Forgejo CI Runners" row of the overview dashboard
prometheus:
  operator:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack

resources:
  operator:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  metricServer:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  webhooks:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
