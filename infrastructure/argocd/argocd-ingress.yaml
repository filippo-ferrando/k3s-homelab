# argocd insecure mode -> ssl managed by traefik
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
data:
  server.insecure: "true"

---
#traefik ingress
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-server
  namespace: argocd
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`argocd.internal.fferrando.cc`)
      kind: Rule
      services:
        - name: argocd-server
          port: 80
