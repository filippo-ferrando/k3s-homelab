apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-internal
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  secretName: argocd-internal-tls
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
  dnsNames:
    - argocd.internal.fferrando.cc
