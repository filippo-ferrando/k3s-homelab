apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana-internal
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  secretName: grafana-internal-tls
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
  dnsNames:
    - stats.internal.fferrando.cc
