apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-k3s-homelab
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    argocd.argoproj.io/sync-wave: "2"
data:
  k3s-homelab.json: |
    {
      "apiVersion": "dashboard.grafana.app/v2",
      "kind": "Dashboard",
      "metadata": {
        "name": "k3s-homelab",
        "namespace": "default",
        "title": "K3s Homelab Overview"
      },
      "spec": {
        "annotations": [
          {
            "kind": "AnnotationQuery",
            "spec": {
              "query": {
                "kind": "DataQuery",
                "group": "grafana",
                "version": "v0",
                "datasource": {
                  "name": "-- Grafana --"
                },
                "spec": {}
              },
              "enable": true,
              "hide": true,
              "iconColor": "rgba(0, 211, 255, 1)",
              "name": "Annotations & Alerts",
              "builtIn": true
            }
          }
        ],
        "cursorSync": "Crosshair",
        "editable": true,
        "elements": {
          "panel-1": {
            "kind": "Panel",
            "spec": {
              "id": 1,
              "title": "Nodes",
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": { "name": "${DS_PROMETHEUS}" },
                          "spec": { "expr": "count(kube_node_info)" }
                        },
                        "refId": "A"
                      }
                    }
                  ]
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "stat",
                "version": "13.2.0",
                "spec": {
                  "options": { "colorMode": "value", "graphMode": "area" }
                }
              }
            }
          },
          "panel-2": {
            "kind": "Panel",
            "spec": {
              "id": 2,
              "title": "Ready nodes",
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": { "name": "${DS_PROMETHEUS}" },
                          "spec": { "expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})" }
                        },
                        "refId": "A"
                      }
                    }
                  ]
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "stat",
                "version": "13.2.0",
                "spec": {
                  "options": { "colorMode": "value", "graphMode": "area" }
                }
              }
            }
          },
          "panel-3": {
            "kind": "Panel",
            "spec": {
              "id": 3,
              "title": "Unhealthy pods",
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": { "name": "${DS_PROMETHEUS}" },
                          "spec": { "expr": "sum(kube_pod_status_phase{phase=~\"Failed|Unknown\"})" }
                        },
                        "refId": "A"
                      }
                    }
                  ]
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "stat",
                "version": "13.2.0",
                "spec": {
                  "options": { "colorMode": "value" }
                }
              }
            }
          },
          "panel-4": {
            "kind": "Panel",
            "spec": {
              "id": 4,
              "title": "Pending pods",
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": { "name": "${DS_PROMETHEUS}" },
                          "spec": { "expr": "sum(kube_pod_status_phase{phase=\"Pending\"})" }
                        },
                        "refId": "A"
                      }
                    }
                  ]
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "stat",
                "version": "13.2.0",
                "spec": {
                  "options": { "colorMode": "value" }
                }
              }
            }
          },
          "panel-10": {
            "kind": "Panel",
            "spec": {
              "id": 10,
              "title": "CPU usage by node",
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": { "name": "${DS_PROMETHEUS}" },
                          "spec": {
                            "expr": "100 * (1 - avg by(instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])))",
                            "legendFormat": "{{instance}}"
                          }
                        },
                        "refId": "A"
                      }
                    }
                  ]
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "timeseries",
                "version": "13.2.0",
                "spec": {
                  "fieldConfig": {
                    "defaults": { "unit": "percent", "min": 0, "max": 100 }
                  }
                }
              }
            }
          },
          "panel-11": {
            "kind": "Panel",
            "spec": {
              "id": 11,
              "title": "Memory usage by node",
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": { "name": "${DS_PROMETHEUS}" },
                          "spec": {
                            "expr": "100 * (1 - (max by (instance) (node_memory_MemAvailable_bytes) / max by (instance) (node_memory_MemTotal_bytes)))",
                            "legendFormat": "{{instance}}"
                          }
                        },
                        "refId": "A"
                      }
                    }
                  ]
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "timeseries",
                "version": "13.2.0",
                "spec": {
                  "fieldConfig": {
                    "defaults": { "unit": "percent", "min": 0, "max": 100 }
                  }
                }
              }
            }
          },
          "panel-12": {
            "kind": "Panel",
            "spec": {
              "id": 12,
              "title": "Root filesystem usage",
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": { "name": "${DS_PROMETHEUS}" },
                          "spec": {
                            "expr": "100 * (1 - (max by (instance, mountpoint) (node_filesystem_avail_bytes{fstype!~\"tmpfs|overlay|squashfs\",mountpoint!~\"/run/k3s/containerd/.*|/var/lib/kubelet/.*\"}) / max by (instance, mountpoint) (node_filesystem_size_bytes{fstype!~\"tmpfs|overlay|squashfs\",mountpoint!~\"/run/k3s/containerd/.*|/var/lib/kubelet/.*\"})))",
                            "legendFormat": "{{instance}}:{{mountpoint}}"
                          }
                        },
                        "refId": "A"
                      }
                    }
                  ]
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "timeseries",
                "version": "13.2.0",
                "spec": {
                  "fieldConfig": {
                    "defaults": { "unit": "percent", "min": 0, "max": 100 }
                  }
                }
              }
            }
          },
          "panel-13": {
            "kind": "Panel",
            "spec": {
              "id": 13,
              "title": "Network receive / transmit",
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": { "name": "${DS_PROMETHEUS}" },
                          "spec": {
                            "expr": "sum by(instance) (rate(node_network_receive_bytes_total{device!=\"lo\"}[5m]))",
                            "legendFormat": "{{instance}} RX"
                          }
                        },
                        "refId": "A"
                      }
                    },
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": { "name": "${DS_PROMETHEUS}" },
                          "spec": {
                            "expr": "sum by(instance) (rate(node_network_transmit_bytes_total{device!=\"lo\"}[5m]))",
                            "legendFormat": "{{instance}} TX"
                          }
                        },
                        "refId": "B"
                      }
                    }
                  ]
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "timeseries",
                "version": "13.2.0",
                "spec": {
                  "fieldConfig": { "defaults": { "unit": "Bps" } }
                }
              }
            }
          },
          "panel-20": {
            "kind": "Panel",
            "spec": {
              "id": 20,
              "title": "Pod restarts",
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": { "name": "${DS_PROMETHEUS}" },
                          "spec": {
                            "expr": "sum by(namespace,pod) (increase(kube_pod_container_status_restarts_total[1h])) > 0",
                            "legendFormat": "{{namespace}} / {{pod}}"
                          }
                        },
                        "refId": "A"
                      }
                    }
                  ]
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "piechart",
                "version": "13.2.0"
              }
            }
          },
          "panel-21": {
            "kind": "Panel",
            "spec": {
              "id": 21,
              "title": "Pods not ready (excluding completed jobs)",
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": { "name": "${DS_PROMETHEUS}" },
                          "spec": {
                            "expr": "kube_pod_status_ready{condition=\"false\"} == 1 and on(pod, namespace) kube_pod_status_phase{phase=~\"Pending|Running|Failed\"} == 1",
                            "format": "table",
                            "instant": true
                          }
                        },
                        "refId": "A"
                      }
                    }
                  ]
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "table",
                "version": "13.2.0"
              }
            }
          },
          "panel-22": {
            "kind": "Panel",
            "spec": {
              "id": 22,
              "title": "Container CPU",
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": { "name": "${DS_PROMETHEUS}" },
                          "spec": {
                            "expr": "sum by(namespace,pod) (rate(container_cpu_usage_seconds_total{container!=\"\",container!=\"POD\"}[5m]))",
                            "legendFormat": "{{namespace}} / {{pod}}"
                          }
                        },
                        "refId": "A"
                      }
                    }
                  ]
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "timeseries",
                "version": "13.2.0",
                "spec": {
                  "fieldConfig": { "defaults": { "unit": "cores" } }
                }
              }
            }
          },
          "panel-23": {
            "kind": "Panel",
            "spec": {
              "id": 23,
              "title": "Container memory",
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": { "name": "${DS_PROMETHEUS}" },
                          "spec": {
                            "expr": "sum by(namespace,pod) (container_memory_working_set_bytes{container!=\"\",container!=\"POD\"})",
                            "legendFormat": "{{namespace}} / {{pod}}"
                          }
                        },
                        "refId": "A"
                      }
                    }
                  ]
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "timeseries",
                "version": "13.2.0",
                "spec": {
                  "fieldConfig": { "defaults": { "unit": "bytes" } }
                }
              }
            }
          },
          "panel-24": {
            "kind": "Panel",
            "spec": {
              "id": 24,
              "title": "PersistentVolumeClaim (PVC) Storage Usage",
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": { "name": "${DS_PROMETHEUS}" },
                          "spec": {
                            "expr": "100 * kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes",
                            "legendFormat": "{{namespace}} / {{persistentvolumeclaim}}"
                          }
                        },
                        "refId": "A"
                      }
                    }
                  ]
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "timeseries",
                "version": "13.2.0",
                "spec": {
                  "fieldConfig": {
                    "defaults": { "unit": "percent", "min": 0, "max": 100 }
                  }
                }
              }
            }
          },
          "panel-30": {
            "kind": "Panel",
            "spec": {
              "id": 30,
              "title": "Longhorn disks not ready",
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": { "name": "${DS_PROMETHEUS}" },
                          "spec": { "expr": "count(longhorn_disk_status{condition=\"ready\"} == 0)" }
                        },
                        "refId": "A"
                      }
                    }
                  ]
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "stat",
                "version": "13.2.0"
              }
            }
          },
          "panel-31": {
            "kind": "Panel",
            "spec": {
              "id": 31,
              "title": "Unschedulable disks",
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": { "name": "${DS_PROMETHEUS}" },
                          "spec": { "expr": "count(longhorn_disk_status{condition=\"schedulable\"} == 0)" }
                        },
                        "refId": "A"
                      }
                    }
                  ]
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "stat",
                "version": "13.2.0"
              }
            }
          },
          "panel-32": {
            "kind": "Panel",
            "spec": {
              "id": 32,
              "title": "Longhorn disk usage",
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": { "name": "${DS_PROMETHEUS}" },
                          "spec": {
                            "expr": "100 * longhorn_disk_usage_bytes / longhorn_disk_capacity_bytes",
                            "legendFormat": "{{node}} / {{disk}}"
                          }
                        },
                        "refId": "A"
                      }
                    }
                  ]
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "timeseries",
                "version": "13.2.0",
                "spec": {
                  "fieldConfig": {
                    "defaults": { "unit": "percent", "min": 0, "max": 100 }
                  }
                }
              }
            }
          },
          "panel-33": {
            "kind": "Panel",
            "spec": {
              "id": 33,
              "title": "Longhorn disk status",
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": { "name": "${DS_PROMETHEUS}" },
                          "spec": { "expr": "longhorn_disk_status", "format": "table", "instant": true }
                        },
                        "refId": "A"
                      }
                    }
                  ]
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "table",
                "version": "13.2.0"
              }
            }
          },
          "panel-34": {
            "kind": "Panel",
            "spec": {
              "id": 34,
              "title": "Longhorn volume state",
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": { "name": "${DS_PROMETHEUS}" },
                          "spec": {
                            "expr": "longhorn_volume_state",
                            "legendFormat": "{{volume}} / {{state}}"
                          }
                        },
                        "refId": "A"
                      }
                    }
                  ]
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "timeseries",
                "version": "13.2.0"
              }
            }
          },
          "panel-35": {
            "kind": "Panel",
            "spec": {
              "id": 35,
              "title": "Longhorn engine state",
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": { "name": "${DS_PROMETHEUS}" },
                          "spec": {
                            "expr": "longhorn_engine_state",
                            "legendFormat": "{{volume}} / {{node}} / {{state}}"
                          }
                        },
                        "refId": "A"
                      }
                    }
                  ]
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "timeseries",
                "version": "13.2.0"
              }
            }
          },
          "panel-40": {
            "kind": "Panel",
            "spec": {
              "id": 40,
              "title": "Traefik requests",
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": { "name": "${DS_PROMETHEUS}" },
                          "spec": {
                            "expr": "sum(rate(traefik_entrypoint_requests_total[5m])) by (entrypoint)",
                            "legendFormat": "{{entrypoint}}"
                          }
                        },
                        "refId": "A"
                      }
                    }
                  ]
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "timeseries",
                "version": "13.2.0",
                "spec": {
                  "fieldConfig": { "defaults": { "unit": "reqps" } }
                }
              }
            }
          },
          "panel-41": {
            "kind": "Panel",
            "spec": {
              "id": 41,
              "title": "Traefik 4xx / 5xx",
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": { "name": "${DS_PROMETHEUS}" },
                          "spec": {
                            "expr": "sum(rate(traefik_entrypoint_requests_total{code=~\"4..\"}[5m])) by (entrypoint)",
                            "legendFormat": "{{entrypoint}} 4xx"
                          }
                        },
                        "refId": "A"
                      }
                    },
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": { "name": "${DS_PROMETHEUS}" },
                          "spec": {
                            "expr": "sum(rate(traefik_entrypoint_requests_total{code=~\"5..\"}[5m])) by (entrypoint)",
                            "legendFormat": "{{entrypoint}} 5xx"
                          }
                        },
                        "refId": "B"
                      }
                    }
                  ]
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "timeseries",
                "version": "13.2.0",
                "spec": {
                  "fieldConfig": { "defaults": { "unit": "reqps" } }
                }
              }
            }
          },
          "panel-42": {
            "kind": "Panel",
            "spec": {
              "id": 42,
              "title": "Traefik service response duration",
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": { "name": "${DS_PROMETHEUS}" },
                          "spec": {
                            "expr": "histogram_quantile(0.95, sum by(le,service) (rate(traefik_service_request_duration_seconds_bucket[5m])))",
                            "legendFormat": "{{service}} p95"
                          }
                        },
                        "refId": "A"
                      }
                    }
                  ]
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "timeseries",
                "version": "13.2.0",
                "spec": {
                  "fieldConfig": { "defaults": { "unit": "s" } }
                }
              }
            }
          },
          "panel-50": {
            "kind": "Panel",
            "spec": {
              "id": 50,
              "title": "Prometheus scrape health",
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": { "name": "${DS_PROMETHEUS}" },
