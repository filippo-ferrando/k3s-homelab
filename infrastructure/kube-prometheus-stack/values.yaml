prometheus:
  prometheusSpec:
    retention: 3d
    retentionSize: 3GiB
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}
    resources:
      requests:
        memory: 512Mi
        cpu: 250m
      limits:
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn-single-replica
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 7Gi

# k3s runs apiserver, etcd client and kubelet in one process, so the kubelet
# /metrics endpoint re-exposes the same apiserver/etcd histograms on every node.
# Drop them on both jobs to keep Prometheus head series (and GC pressure) low.
kubeApiServer:
  serviceMonitor:
    metricRelabelings:
      - &dropApiserverHistograms
        sourceLabels: [__name__]
        action: drop
        regex: '(apiserver_.*_bucket|etcd_request_duration_seconds_bucket|workqueue_.*_duration_seconds_bucket)'

kubelet:
  serviceMonitor:
    metricRelabelings:
      - *dropApiserverHistograms

prometheus-node-exporter:
  resources:
    requests:
      memory: 32Mi
    limits:
      memory: 128Mi

  securityContext:
    fsGroup: 0
    runAsGroup: 0
    runAsNonRoot: false
    runAsUser: 0
    # Nodes run k3s --selinux: under the default container_t label the filesystem collector
    # can't statfs host mounts (no node_filesystem_* at all). spc_t lifts SELinux confinement
    # without privileged's capabilities and device access.
    seLinuxOptions:
      type: spc_t

  containerSecurityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
      # Root without DAC_READ_SEARCH can't traverse root-only dirs to reach some mount points
      add: [DAC_READ_SEARCH]

  extraArgs:
    - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)
    - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|tmpfs)$

grafana:
  # peak ~670Mi
  resources:
    requests:
      memory: 512Mi
    limits:
      memory: 1Gi
  sidecar:
    resources:
      requests:
        memory: 64Mi
      limits:
        memory: 256Mi
  adminPassword: "admin" # You will change this in the Grafana UI on first login
  persistence:
    enabled: true
    storageClassName: longhorn-single-replica
    size: 5Gi
  grafana.ini:
    security:
      # Drops Grafana's X-Frame-Options: DENY so the portfolio homepage can iframe the shared dashboard.
      # Framing is then restricted per route by Traefik: frame-ancestors on the public route,
      # X-Frame-Options DENY on the internal UI (middleware-grafana-embed-headers.yaml).
      allow_embedding: true

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        memory: 64Mi
      limits:
        memory: 256Mi
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn-single-replica
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

kube-state-metrics:
  resources:
    requests:
      memory: 32Mi
    limits:
      memory: 128Mi

prometheusOperator:
  resources:
    requests:
      memory: 32Mi
    limits:
      memory: 128Mi
  prometheusConfigReloader:
    resources:
      requests:
        memory: 32Mi
      limits:
        memory: 128Mi
