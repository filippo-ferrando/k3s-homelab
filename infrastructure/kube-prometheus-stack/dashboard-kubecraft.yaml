                      "color": "blue",
                      "index": 2
                    },
                    "4": {
                      "text": "stopping",
                      "color": "orange",
                      "index": 3
                    },
                    "5": {
                      "text": "stopped",
                      "color": "text",
                      "index": 4
                    },
                    "6": {
                      "text": "sleeping",
                      "color": "purple",
                      "index": 5
                    },
                    "7": {
                      "text": "error",
                      "color": "red",
                      "index": 6
                    },
                    "8": {
