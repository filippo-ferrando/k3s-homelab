# Public dashboard for the portfolio pod, shared externally via Grafana "Shared dashboards"
# (exposed through ingressroute-public.yaml) and embedded on the fferrando.cc homepage.
# Every query aggregates away instance/IP, node, pod and container-id labels:
# the public API returns full series labels even when the legend hides them.
# UI edits are not persisted across restarts: update this file instead.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-portfolio-public
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  portfolio-public.json: |
    {
      "uid": "portfolio-public",
      "title": "Portfolio (public)",
      "tags": [
        "portfolio",
        "public"
      ],
      "editable": false,
      "graphTooltip": 1,
      "liveNow": false,
      "links": [],
      "schemaVersion": 41,
      "timezone": "browser",
      "fiscalYearStartMonth": 0,
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "refresh": "1m",
      "timepicker": {
        "hidden": true
      },
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "templating": {
        "list": []
      },
      "panels": [
        {
          "id": 901,
          "type": "row",
          "title": "Status",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 1,
          "title": "Status",
          "description": "Ready replicas serving the site.",
          "type": "stat",
          "pluginVersion": "13.2.2",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": null,
                    "color": "red"
                  },
                  {
                    "value": 1,
                    "color": "green"
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN",
                      "color": "red"
                    }
                  }
                },
                {
                  "type": "range",
                  "options": {
                    "from": 1,
                    "to": 100,
                    "result": {
                      "text": "UP",
                      "color": "green"
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum(kube_deployment_status_replicas_available{namespace=\"portfolio\",deployment=\"portfolio\"})",
              "legendFormat": "__auto",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "range": true
            }
          ]
        },
        {
          "id": 2,
          "title": "Pod uptime",
          "description": "Time since the current pod started.",
          "type": "stat",
          "pluginVersion": "13.2.2",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 4,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": null,
                    "color": "green"
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "unit": "s"
            },
            "overrides": []
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "time() - max(kube_pod_start_time{namespace=\"portfolio\"})",
              "legendFormat": "__auto",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "range": true
            }
          ]
        },
        {
          "id": 3,
          "title": "Requests",
          "description": "Total requests served in the selected time range.",
          "type": "stat",
          "pluginVersion": "13.2.2",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": null,
                    "color": "green"
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "unit": "short",
              "decimals": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum(increase(traefik_router_requests_total{router=~\"portfolio-portfolio-.*\"}[$__range]))",
              "legendFormat": "__auto",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "range": true
            }
          ]
        },
        {
          "id": 4,
          "title": "Success rate",
          "description": "Share of requests not answered with a 5xx, over the selected time range.",
          "type": "stat",
          "pluginVersion": "13.2.2",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": null,
                    "color": "red"
                  },
                  {
                    "value": 95,
                    "color": "orange"
                  },
                  {
                    "value": 99,
                    "color": "green"
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "unit": "percent",
              "decimals": 2
            },
            "overrides": []
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "(1 - (sum(increase(traefik_router_requests_total{router=~\"portfolio-portfolio-.*\",code=~\"5..\"}[$__range])) or vector(0)) / sum(increase(traefik_router_requests_total{router=~\"portfolio-portfolio-.*\"}[$__range]))) * 100",
              "legendFormat": "__auto",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "range": true
            }
          ]
        },
        {
          "id": 5,
          "title": "Avg latency",
          "description": "Mean request duration measured at the Traefik ingress over the selected time range.",
          "type": "stat",
          "pluginVersion": "13.2.2",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": null,
                    "color": "green"
                  },
                  {
                    "value": 0.3,
                    "color": "orange"
                  },
                  {
                    "value": 1,
                    "color": "red"
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "unit": "s"
            },
            "overrides": []
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum(increase(traefik_router_request_duration_seconds_sum{router=~\"portfolio-portfolio-.*\"}[$__range])) / sum(increase(traefik_router_request_duration_seconds_count{router=~\"portfolio-portfolio-.*\"}[$__range]))",
              "legendFormat": "__auto",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "range": true
            }
          ]
        },
        {
          "id": 6,
          "title": "Restarts",
          "description": "Container restarts of the current pod.",
          "type": "stat",
          "pluginVersion": "13.2.2",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 20,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": null,
                    "color": "green"
                  },
                  {
                    "value": 1,
                    "color": "orange"
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "unit": "short",
              "decimals": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum(kube_pod_container_status_restarts_total{namespace=\"portfolio\",container=\"portfolio\"})",
              "legendFormat": "__auto",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "range": true
            }
          ]
        },
        {
          "id": 902,
          "type": "row",
          "title": "Traffic & latency",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 7,
          "title": "Requests per second",
          "description": "Requests reaching the site through the Traefik ingress, grouped by HTTP status class.",
          "type": "timeseries",
          "pluginVersion": "13.2.2",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 6,
            "w": 12,
            "h": 8
          },
          "options": {
            "legend": {
              "calcs": [
                "mean",
                "max"
              ],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "hideZeros": false,
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 30,
                "gradientMode": "opacity",
                "showPoints": "never",
                "spanNulls": true,
                "axisSoftMin": 0,
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                }
              },
              "color": {
                "mode": "palette-classic"
              },
              "min": 0
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "2xx"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "green"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "3xx"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "blue"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "4xx"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "orange"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "5xx"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "red"
                    }
                  }
                ]
              }
            ]
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum by (class) (label_replace(rate(traefik_router_requests_total{router=~\"portfolio-portfolio-.*\"}[$__rate_interval]), \"class\", \"${1}xx\", \"code\", \"(.).*\"))",
              "legendFormat": "{{class}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "range": true
            }
          ]
        },
        {
          "id": 8,
          "title": "Latency",
          "description": "Request duration at the Traefik ingress. Percentiles are interpolated from coarse histogram buckets (0.1s, 0.3s, 1.2s, 5s); the average is exact.",
          "type": "timeseries",
          "pluginVersion": "13.2.2",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 6,
            "w": 12,
            "h": 8
          },
          "options": {
            "legend": {
              "calcs": [
                "mean",
                "max"
              ],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "hideZeros": false,
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 0,
                "gradientMode": "opacity",
                "showPoints": "never",
                "spanNulls": true,
                "axisSoftMin": 0,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              },
              "color": {
                "mode": "palette-classic"
              },
              "min": 0
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "avg"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "green"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "p50"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "blue"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "p95"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "orange"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "p99"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "red"
                    }
                  }
                ]
              }
            ]
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum(rate(traefik_router_request_duration_seconds_sum{router=~\"portfolio-portfolio-.*\"}[$__rate_interval])) / sum(rate(traefik_router_request_duration_seconds_count{router=~\"portfolio-portfolio-.*\"}[$__rate_interval]))",
              "legendFormat": "avg",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "range": true
            },
            {
              "editorMode": "code",
              "expr": "histogram_quantile(0.50, sum by (le) (rate(traefik_router_request_duration_seconds_bucket{router=~\"portfolio-portfolio-.*\"}[$__rate_interval])))",
              "legendFormat": "p50",
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "range": true
            },
            {
              "editorMode": "code",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(traefik_router_request_duration_seconds_bucket{router=~\"portfolio-portfolio-.*\"}[$__rate_interval])))",
              "legendFormat": "p95",
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "range": true
            },
            {
              "editorMode": "code",
              "expr": "histogram_quantile(0.99, sum by (le) (rate(traefik_router_request_duration_seconds_bucket{router=~\"portfolio-portfolio-.*\"}[$__rate_interval])))",
              "legendFormat": "p99",
              "refId": "D",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "range": true
            }
          ]
        },
        {
          "id": 9,
          "title": "Bandwidth",
          "description": "Bytes sent to and received from visitors at the ingress.",
          "type": "timeseries",
          "pluginVersion": "13.2.2",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 14,
            "w": 12,
            "h": 8
          },
          "options": {
            "legend": {
              "calcs": [
                "mean",
                "max"
              ],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "hideZeros": false,
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "gradientMode": "opacity",
                "showPoints": "never",
                "spanNulls": true,
                "axisSoftMin": 0,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              },
              "color": {
                "mode": "palette-classic"
              },
              "min": 0
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "sent"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "purple"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "received"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "blue"
                    }
                  }
                ]
              }
            ]
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum(rate(traefik_router_responses_bytes_total{router=~\"portfolio-portfolio-.*\"}[$__rate_interval]))",
              "legendFormat": "sent",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "range": true
            },
            {
              "editorMode": "code",
              "expr": "sum(rate(traefik_router_requests_bytes_total{router=~\"portfolio-portfolio-.*\"}[$__rate_interval]))",
              "legendFormat": "received",
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "range": true
            }
          ]
        },
        {
          "id": 10,
          "title": "Latency distribution",
          "description": "Share of requests completed within each latency bucket.",
          "type": "timeseries",
          "pluginVersion": "13.2.2",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 14,
            "w": 12,
            "h": 8
          },
          "options": {
            "legend": {
              "calcs": [
                "mean",
                "min"
              ],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "hideZeros": false,
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 0,
                "gradientMode": "opacity",
                "showPoints": "never",
                "spanNulls": true,
                "axisSoftMin": 0,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              },
              "color": {
                "mode": "palette-classic"
              },
              "min": 0,
              "max": 100
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "< 100ms"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "green"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "< 300ms"
                },
                "properties": [
                  {
                    "id": "color",
