apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: public-ratelimit
  namespace: traefik
spec:
  rateLimit:
    average: 60
    period: 1m
    burst: 30
    # Bucketed per visitor via Cf-Connecting-Ip, set by Cloudflare (RemoteAddr would be the cloudflared pod).
    sourceCriterion:
      requestHeaderName: Cf-Connecting-Ip
