deployment:
  kind: DaemonSet

api:
  dashboard: true

additionalArguments:
  - "--entrypoints.web.http.redirections.entrypoint.to=:443"
  - "--entrypoints.web.http.redirections.entrypoint.scheme=https"

ports:
  web:
    port: 8000
    expose:
      default: true
    exposedPort: 80

  websecure:
    port: 8443
    expose:
      default: true
    exposedPort: 443
    http3:
      enabled: true

  ssh:
    port: 2222
    expose:
      default: true
    exposedPort: 2222

  # Plain HTTP from cloudflared (TLS ends at Cloudflare); the tunnel targets the traefik-internal Service.
  # ponytail: phase 1 of moving it off the LoadBalancer, set default: false once no tunnel route uses the traefik Service
  cf-public:
    port: 9443
    expose:
      default: true
      internal: true
    exposedPort: 9443

  metrics:
    port: 9100
    expose:
      default: false
    exposedPort: 9100

service:
  # ClusterIP-only Service for ports that must never be reachable from the LAN (cf-public)
  additionalServices:
    internal:
      type: ClusterIP

ingressRoute:
  dashboard:
    enabled: true
    matchRule: Host(`traefik.internal.fferrando.cc`)
    entryPoints:
      - websecure
    middlewares:
      - name: traefik-dashboard-auth
    tls:
      secretName: traefik-internal-tls

providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: false

metrics:
  prometheus:
    entryPoint: metrics

    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true

    service:
      enabled: true

    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack

resources:
  requests:
    memory: 64Mi
  limits:
    memory: 256Mi
