apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: traefik-internal-tls
  namespace: traefik
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  secretName: traefik-internal-tls
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
  dnsNames:
    - traefik.internal.fferrando.cc
