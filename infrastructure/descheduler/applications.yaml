apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: descheduler
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    chart: descheduler
    repoURL: https://kubernetes-sigs.github.io/descheduler/
    targetRevision: 0.37.0
    helm:
      values: |
        kind: CronJob
        schedule: "0 */2 * * *" # Runs every 2 hours
        # No deschedulerPolicy override: the chart's default v1alpha2 profile already enables
        # RemoveDuplicates, RemovePodsViolatingInterPodAntiAffinity and LowNodeUtilization (20/50 thresholds),
        # plus restart/taint/affinity/topology-spread plugins.
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
