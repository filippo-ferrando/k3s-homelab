apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lastgasp-internal
  namespace: lastgasp
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  entryPoints:
    - websecure
  routes:
    # /metrics stays in the cluster: Prometheus scrapes the service directly
    - match: Host(`lastgasp.internal.fferrando.cc`) && !PathPrefix(`/metrics`)
      kind: Rule
      services:
        # <release>-http service from the chart
        - name: lastgasp-http
          port: 8080
  tls:
    secretName: lastgasp-internal-tls
