server:
  publicURL: https://lastgasp.internal.fferrando.cc

  database:
    url: postgres://lastgasp@homelab-db-rw.database.svc.cluster.local:5432/lastgasp?sslmode=require
    passwordSecret:
      name: lastgasp-db-credentials
      key: password
  persistence:
    enabled: false

  # Records are deleted after 720h (chart default) or once they exceed 2GiB on the shared homelab-db
  retainBytes: 2GiB

  auth:
    existingSecret: lastgasp-auth

  extraArgs:
    - -auth-proxy-header=X-Forwarded-For
    - -auth-trusted-proxies=10.42.0.0/16

  requireForwardSecrecy: true

agent:
  enroll:
    tokenSecret:
      name: lastgasp-join
  kmsgHostPath: false
  # Userspace journal lines, sent over the same UDP 5140 as kmsg.
  # The nodes keep the journal in RAM only (/run/log/journal, no /var/log/journal), hence persistent: false.
  journal:
    enabled: true
    priority: warning
    rate: 200
    persistent: false
  podSecurityContext:
    seLinuxOptions:
      type: spc_t
  securityContext:
    privileged: false
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsUser: 0
    capabilities:
      drop: [ALL]
      add: [SYSLOG, IPC_LOCK, SYS_RESOURCE]
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 10m
      memory: 96Mi
    limits:
      # 128Mi + 64Mi for journalctl, as recommended upstream
      memory: 192Mi
      devic.es/kmsg: 1

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
  prometheusRule:
    enabled: true
    labels:
      release: kube-prometheus-stack
