server:
  publicURL: https://lastgasp.internal.fferrando.cc

  database:
    url: postgres://lastgasp@homelab-db-rw.database.svc.cluster.local:5432/lastgasp?sslmode=require
    passwordSecret:
      name: lastgasp-db-credentials
      key: password
  persistence:
    enabled: false

  auth:
    existingSecret: lastgasp-auth

  extraArgs:
    - -auth-proxy-header=X-Forwarded-For
    - -auth-trusted-proxies=10.42.0.0/16

  requireForwardSecrecy: true

agent:
  enroll:
    tokenSecret:
      name: lastgasp-join
  kmsgHostPath: false
  podSecurityContext:
    seLinuxOptions:
      type: spc_t
  securityContext:
    privileged: false
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsUser: 0
    capabilities:
      drop: [ALL]
      add: [SYSLOG, IPC_LOCK, SYS_RESOURCE]
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 10m
      memory: 96Mi
    limits:
      memory: 128Mi
      devic.es/kmsg: 1

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
  prometheusRule:
    enabled: true
    labels:
      release: kube-prometheus-stack
