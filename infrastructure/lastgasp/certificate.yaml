apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lastgasp-internal-tls
  namespace: lastgasp
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  secretName: lastgasp-internal-tls
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
  dnsNames:
    - lastgasp.internal.fferrando.cc
