apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kured
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  sources:
    - chart: kured
      repoURL: https://kubereboot.github.io/charts
      targetRevision: 6.1.0
      helm:
        valueFiles:
          - $values/infrastructure/kured/values.yaml
    - repoURL: "https://github.com/filippo-ferrando/k3s-homelab.git"
      targetRevision: HEAD
      ref: values
  destination:
    server: "https://kubernetes.default.svc"
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
