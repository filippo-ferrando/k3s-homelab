driver:
  kind: modern_ebpf
  modernEbpf:
    leastPrivileged: true

tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule

metrics:
  enabled: true

serviceMonitor:
  create: true
  labels:
    release: kube-prometheus-stack

falcosidekick:
  enabled: true
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: kube-prometheus-stack
