driver:
  kind: modern_ebpf

tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule

metrics:
  enabled: true

serviceMonitor:
  create: true
  labels:
    release: kube-prometheus-stack

falcosidekick:
  enabled: true
  resources:
    requests:
      memory: 32Mi
    limits:
      memory: 128Mi
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: kube-prometheus-stack

falcoctl:
  artifact:
    follow:
      resources:
        requests:
          memory: 32Mi
        limits:
          memory: 128Mi

customRules:
  rules-cnpg-wal.yaml: |-
    - macro: postgres_running_cnpg
      condition: >-
        or (k8s.ns.name=database
            and container.image.repository=ghcr.io/cloudnative-pg/postgresql
            and user.uid=26
            and proc.exepath=/usr/bin/dash
            and proc.pexepath glob "/usr/lib/postgresql/*/bin/postgres"
            and (proc.cmdline startswith "sh -c -- /controller/manager wal-archive "
                 or proc.cmdline startswith "sh -c -- /controller/manager wal-restore ")
            and not proc.cmdline contains ";"
            and not proc.cmdline contains "|"
            and not proc.cmdline contains "&"
            and not proc.cmdline contains "`"
            and not proc.cmdline contains "$(")
      override:
        condition: append

  rules-k8s-api.yaml: |-
    - macro: user_known_contact_k8s_api_server_activities
      condition: >-
        (k8s.ns.name=argocd
         and container.image.repository=quay.io/argoproj/argocd
         and proc.exepath=/usr/local/bin/argocd)
        or (k8s.ns.name=argocd
            and container.image.repository=ghcr.io/dexidp/dex
            and proc.exepath=/shared/argocd-dex)
        or (k8s.ns.name=cert-manager
            and container.image.repository=quay.io/jetstack/cert-manager-controller
            and proc.exepath=/app/cmd/controller/controller)
        or (k8s.ns.name=cert-manager
            and container.image.repository=quay.io/jetstack/cert-manager-webhook
            and proc.exepath=/app/cmd/webhook/webhook)
        or (k8s.ns.name=cnpg-system
            and container.image.repository=ghcr.io/cloudnative-pg/cloudnative-pg
            and proc.exepath=/operator/manager_amd64)
        or (k8s.ns.name=database
            and container.image.repository=ghcr.io/cloudnative-pg/postgresql
            and proc.exepath=/controller/manager)
        or (k8s.ns.name=keda
            and ((container.image.repository=ghcr.io/kedacore/keda and proc.exepath=/keda)
                 or (container.image.repository=ghcr.io/kedacore/keda-admission-webhooks and proc.exepath=/keda-admission-webhooks)
                 or (container.image.repository=ghcr.io/kedacore/keda-metrics-apiserver and proc.exepath=/keda-adapter)))
        or (k8s.ns.name=longhorn-system
            and container.image.repository=docker.io/longhornio/longhorn-manager
            and proc.exepath=/usr/local/sbin/longhorn-manager)
        or (k8s.ns.name=longhorn-system
            and ((container.image.repository=docker.io/longhornio/csi-attacher and proc.exepath=/csi-attacher)
                 or (container.image.repository=docker.io/longhornio/csi-provisioner and proc.exepath=/csi-provisioner)
                 or (container.image.repository=docker.io/longhornio/csi-resizer and proc.exepath=/csi-resizer)
                 or (container.image.repository=docker.io/longhornio/csi-snapshotter and proc.exepath=/csi-snapshotter)))
        or (k8s.ns.name=monitoring
            and container.image.repository=registry.k8s.io/kube-state-metrics/kube-state-metrics
            and proc.exepath=/kube-state-metrics)
        or (k8s.ns.name=traefik
            and container.image.repository in (docker.io/library/traefik, docker.io/traefik)
            and proc.exepath=/usr/local/bin/traefik)
      override:
        condition: replace

  rules-forgejo-sshd.yaml: |-
    - macro: user_known_stand_streams_redirect_activities
      condition: >-
        (k8s.ns.name=forgejo
         and container.image.repository=codeberg.org/forgejo/forgejo
         and user.uid=0
         and proc.exepath in (/usr/sbin/sshd, /usr/lib/ssh/sshd-session)
         and fd.lport=22
         and fd.cnet=10.42.0.0/16)
        or (k8s.ns.name=longhorn-system
            and container.image.repository=docker.io/longhornio/longhorn-instance-manager
            and user.uid=0
            and proc.exepath in (/tini, /usr/local/bin/longhorn-instance-manager)
            and (fd.snet=10.42.0.0/16 or fd.sip in ("127.0.0.1", "::1")))
      override:
        condition: replace

  rules-forgejo-binary.yaml: |-
    - macro: known_drop_and_execute_activities
      condition: >-
        (k8s.ns.name=forgejo
         and container.image.repository=codeberg.org/forgejo/forgejo
         and user.uid=1000
         and proc.exepath=/app/gitea/gitea
         and proc.exe_ino.mtime < val(container.start_ts))
      override:
        condition: replace

  # Must sort after rules-forgejo-binary.yaml: rules.d is loaded in alphabetical order, and the
  # append to known_drop_and_execute_activities below has to land on top of the replace there.
  rules-forgejo-runner.yaml: |-
    # CI job containers run inside the runner pod's DinD daemon, so Falco has no k8s or image
    # metadata for them. They are identified by cgroup: dockerd runs with
    # --cgroup-parent=<dind container cgroup>/ci (apps/forgejo-runner/scaledjob.yaml), so every
    # CI container lives under .../kubepods.slice/.../cri-containerd-<id>.scope/ci/<docker id>.
    - macro: forgejo_runner_ci_container
      condition: >-
        (container.id != host
         and thread.cgroups contains "/kubepods.slice/"
         and thread.cgroups contains ".scope/ci/")

    # The DinD sidecar of a runner pod
    - macro: forgejo_runner_dind
      condition: >-
        (k8s.ns.name=forgejo-runner
         and container.name=dind
         and container.image.repository=docker.io/library/docker
         and proc.name=dockerd)

    # CI jobs download toolchains (actions/setup-*), build and run test binaries and install
    # packages: executing binaries that are not in the base image is what they do.
    - macro: known_drop_and_execute_activities
      condition: or (forgejo_runner_ci_container)
      override:
        condition: append

    # systemd-sysusers reads the shadow files when apt-get installs a package that ships users
    - macro: user_known_read_sensitive_files_activities
      condition: >-
        or (forgejo_runner_ci_container
            and proc.exepath=/usr/bin/systemd-sysusers
            and fd.name in (/etc/shadow, /etc/gshadow))
      override:
        condition: append

    # dockerd extracting image layers that contain log files (e.g. /var/log/dpkg.log)
    - macro: allowed_clear_log_files
      condition: >-
        or (forgejo_runner_dind
            and proc.exepath=/usr/local/bin/dockerd
            and fd.name startswith /var/lib/docker/)
      override:
        condition: append

    # dockerd opens an AF_PACKET socket to send gratuitous ARP when it attaches a container to a
    # bridge network. The exepath is docker-init when the event lands right after the fork.
    - rule: Packet socket created in container
      condition: >-
        and not (forgejo_runner_dind
                 and proc.exepath in (/usr/local/bin/dockerd, /usr/local/bin/docker-init))
      override:
        condition: append
