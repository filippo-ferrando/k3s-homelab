driver:
  kind: modern_ebpf
  # modernEbpf.leastPrivileged (capabilities instead of a privileged container)
  # fails hard on AlmaLinux: SELinux's confined container_t domain blocks BPF
  # ring-buffer map creation even with the right capabilities present -
  # "libpman: ring buffer map type is not supported (errno 13, Permission
  # denied)". Same failure mode reported on OpenShift for the same reason
  # (also SELinux-enforcing by default). Left at the chart default (false,
  # fully privileged container) instead.

tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule

metrics:
  enabled: true

serviceMonitor:
  create: true
  labels:
    release: kube-prometheus-stack

falcosidekick:
  enabled: true
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: kube-prometheus-stack

customRules:
  rules-cnpg-wal-archive.yaml: |-
    - macro: postgres_running_cnpg
      condition: or (proc.pname=postgres and proc.cmdline startswith "sh -c -- /controller/manager wal-archive")
      override:
        condition: append

  rules-argocd-k8s-api.yaml: |-
    - macro: user_known_contact_k8s_api_server_activities
      condition: k8s.ns.name="argocd"
      override:
        condition: replace

  rules-kube-prom-k8s-api.yaml: |-
    - macro: user_known_contact_k8s_api_server_activities
      condition: k8s.ns.name="monitoring"
      override:
        condition: replace
