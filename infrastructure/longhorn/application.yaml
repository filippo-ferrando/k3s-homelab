apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default

  sources:
    - repoURL: https://charts.longhorn.io
      targetRevision: 1.12.1
      chart: longhorn
      helm:
        valueFiles:
          - $values/infrastructure/longhorn/values.yaml

    - repoURL: https://github.com/filippo-ferrando/k3s-homelab.git
      targetRevision: HEAD
      ref: values

    - repoURL: https://github.com/filippo-ferrando/k3s-homelab.git
      targetRevision: HEAD
      path: infrastructure/longhorn/resources

  destination:
    server: "https://kubernetes.default.svc"
    namespace: longhorn-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
