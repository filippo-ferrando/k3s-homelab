apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  project: default
  source:
    chart: longhorn
    repoURL: https://charts.longhorn.io
    targetRevision: 1.12.1
    helm:
      valueFiles:
        - $values/infrastructure/longhorn/values.yaml
  sources:
    - chart: longhorn
      repoURL: https://charts.longhorn.io
      targetRevision: 1.12.1
    - repoURL: "https://github.com/filippo-ferrando/k3s-homelab.git"
      targetRevision: HEAD
      ref: values
  destination:
    server: "https://kubernetes.default.svc"
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
