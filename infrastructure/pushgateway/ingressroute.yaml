apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pushgateway
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`pushgateway.internal.fferrando.cc`)
      kind: Rule
      services:
        - name: pushgateway-prometheus-pushgateway
          port: 9091
  tls:
    secretName: pushgateway-internal-tls
