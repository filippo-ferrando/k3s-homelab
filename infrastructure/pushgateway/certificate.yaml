apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pushgateway-internal-tls
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  secretName: pushgateway-internal-tls
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
  dnsNames:
    - pushgateway.internal.fferrando.cc
