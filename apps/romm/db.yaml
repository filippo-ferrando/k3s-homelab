apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: romm-user
  namespace: database
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  cluster:
    name: homelab-db
  name: romm
  login: true
  passwordSecret:
    name: romm-db-credentials
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: romm
  namespace: database
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  name: romm
  owner: romm
  cluster:
    name: homelab-db
