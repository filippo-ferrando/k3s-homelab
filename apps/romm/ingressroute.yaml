apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: romm-internal
  namespace: romm
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`rom.internal.fferrando.cc`)
      kind: Rule
      services:
        - name: romm
          port: 8080
  tls:
    secretName: romm-internal-tls
