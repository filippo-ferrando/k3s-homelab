apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: romm-internal-tls
  namespace: romm
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  secretName: romm-internal-tls
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
  dnsNames:
    - rom.internal.fferrando.cc
