apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-nfs
spec:
  capacity:
    storage: 2Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: jellyfin-nfs
  mountOptions:
    - vers=4
    - proto=tcp
  nfs:
    server: 192.168.10.101
    path: /mnt/media
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-nfs
  namespace: jellyfin
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: jellyfin-nfs
  resources:
    requests:
      storage: 2Ti
