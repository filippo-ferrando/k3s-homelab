apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: jellyfin-internal-tls
  namespace: jellyfin
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  secretName: jellyfin-internal-tls
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
  dnsNames:
    - jellyfin.internal.fferrando.cc
