apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  replicas: 1
  # ReadWriteOnce volume: the old pod must release it before the new one starts
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      # No RBAC is granted to the default SA: no reason to mount its token
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # existing files on the config PVC are root-owned: fsGroup makes them group-writable
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jellyfin
          image: ghcr.io/jpvenson/jellyfin.pgsql:10.11.11-1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8096

          env:
            # /root is 0700 in the image; .NET keeps its data protection keys under $HOME
            - name: HOME
              value: /home/jellyfin
            - name: POSTGRES_HOST
              value: homelab-db-rw.database.svc.cluster.local

            - name: POSTGRES_PORT
              value: "5432"

            - name: POSTGRES_DB
              value: jellyfin

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: jellyfin-db-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jellyfin-db-credentials
                  key: password

          resources:
            limits:
              memory: 2Gi
              cpu: "2.0"
            requests:
              memory: 512Mi
              cpu: "250m"

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20

          volumeMounts:
            # Read-only root filesystem: paths Jellyfin and .NET write at runtime
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/jellyfin
            - name: fontconfig
              mountPath: /var/cache/fontconfig
            - name: dictionaries
              mountPath: /jellyfin/Dictionaries
            - name: config
              mountPath: /config
            - name: cache
              mountPath: /cache
            - name: media
              mountPath: /media
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: home
          emptyDir:
            sizeLimit: 16Mi
        - name: fontconfig
          emptyDir:
            sizeLimit: 64Mi
        - name: dictionaries
          emptyDir:
            sizeLimit: 16Mi
        - name: cache
          emptyDir: {}
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: media
          persistentVolumeClaim:
            claimName: jellyfin-nfs
