# Destination of the weekly pg_dump backups. The directory must exist on casper, owned by uid 26
# (postgres in the CNPG image): ansible/provision/06_nfs.yml creates it. fsGroup has no effect on NFS.
# /mnt/vault is also backed up by Borg on magi, so every dump gets a second copy.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pg-backups-nfs
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: pg-backups-nfs
  mountOptions:
    - vers=4
    - proto=tcp
  nfs:
    server: 192.168.10.101
    path: /mnt/vault/data/backups/pg_db
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pg-backups-nfs
  namespace: database
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: pg-backups-nfs
  resources:
    requests:
      storage: 50Gi
