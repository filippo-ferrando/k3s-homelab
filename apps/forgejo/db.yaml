apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: forgejo-user
  namespace: database
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  cluster:
    name: homelab-db
  name: forgejo
  login: true
  passwordSecret:
    name: forgejo-db-credentials
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: forgejo
  namespace: database
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  name: forgejo
  owner: forgejo
  cluster:
    name: homelab-db
