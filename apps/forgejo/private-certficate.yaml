apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: forgejo-internal-tls
  namespace: forgejo
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  secretName: forgejo-internal-tls
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
  dnsNames:
    - git.internal.fferrando.cc
