apiVersion: v1
kind: PersistentVolume
metadata:
  name: lychee-photos-nfs
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: lychee-nfs
  mountOptions:
    - vers=4
    - proto=tcp
  nfs:
    server: 192.168.10.101
    path: /mnt/vault/data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lychee-photos
  namespace: lychee
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: lychee-nfs
  resources:
    requests:
      storage: 1Ti
