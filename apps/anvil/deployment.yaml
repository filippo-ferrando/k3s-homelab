apiVersion: apps/v1
kind: Deployment
metadata:
  name: anvil-website
  namespace: anvil-website
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: anvil-website
  template:
    metadata:
      labels:
        app: anvil-website
    spec:
      # No RBAC is granted to the default SA: no reason to mount its token
      automountServiceAccountToken: false
      securityContext:
        # nginx-unprivileged image; numeric uid so the kubelet can verify runAsNonRoot
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: anvil-website
          image: git.fferrando.cc/anvil/website:20261105-1502
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
          # nginx answers /healthz with a static 200 (see nginx.conf in the website repo)
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            # nginx pid and temp files
            - name: tmp
              mountPath: /tmp
          resources:
            limits:
              memory: 512Mi
              cpu: "0.5"
            requests:
              memory: 256Mi
              cpu: "250m"
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
