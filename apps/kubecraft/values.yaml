# kubecraft: UI on mine.internal.fferrando.cc (LAN and tailnet only).
# Servers: <slug>.mine.internal.fferrando.cc:25565 on the LAN and tailnet, and publicly
# through playit.gg once a tunnel named kubecraft-<slug> exists (see playit below).
manager:
  uiHost: mine.internal.fferrando.cc
  serverBaseDomain: mine.internal.fferrando.cc
  storageClass: longhorn-single-replica
  defaultMaxServers: 2

# SESSION_SECRET and the bootstrap admin (secrets.yaml)
secrets:
  existingSecret: kubecraft-secrets

database:
  host: homelab-db-rw.database.svc.cluster.local
  name: kubecraft
  sslmode: require
  credentialsSecret:
    name: kubecraft-db-credentials

# TLS and routing are in certificate.yaml / ingressroute.yaml, like the other apps
ingressRoute:
  enabled: false
certificate:
  enabled: false

mcRouter:
  # k3s ServiceLB listens on 25565 on every node; nothing forwards it from the internet
  service:
    type: LoadBalancer
  autoScale:
    enabled: true
    downAfter: 15m
  metrics: true

# playit.gg (we are behind CGNAT): the agent runs in a gateway pod. For each server,
# create a Minecraft Java tunnel in the playit dashboard named kubecraft-<slug>,
# local address 127.0.0.1, local port as suggested on the server page.
playit:
  enabled: true
  existingSecret: kubecraft-playit
  secretKey: SECRET_KEY

# kube-prometheus-stack selects every ServiceMonitor
metrics:
  serviceMonitor:
    enabled: true

networkPolicy:
  managerFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik
  metricsFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
