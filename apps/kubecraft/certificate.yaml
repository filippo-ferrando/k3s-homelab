apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kubecraft-internal-tls
  namespace: minecraft
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  secretName: kubecraft-internal-tls
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
  dnsNames:
    - mine.internal.fferrando.cc
