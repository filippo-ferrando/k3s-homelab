apiVersion: v1
kind: ConfigMap
metadata:
  name: vdirsyncer-config
  namespace: baikal
data:
  config: |
    [general]
    status_path = "/vdirsyncer/status"

    # ==========================================
    # FEED 1: Data Protection
    # ==========================================
    [pair data_protection]
    a = "data_protection_remote"
    b = "baikal_data_protection"
    collections = null
    conflict_resolution = "b wins"

    [storage data_protection_remote]
    type = "http"
    url = "http://www.swas.polito.it/dotnet/orari_lezione_pub/Export_ics.aspx?id_imt=258380&numcor=0&a_acc=2027&pd=1"
    read_only = true

    [storage baikal_data_protection]
    type = "caldav"
    url = "http://baikal.baikal.svc.cluster.local/dav.php/calendars/rdfilippo/data_protection/"
    username.fetch = ["command", "printenv", "BAIKAL_USERNAME"]
    password.fetch = ["command", "printenv", "BAIKAL_PASSWORD"]

    # ==========================================
    # FEED 2: AI & Cyber Security
    # ==========================================
    [pair ai_and_cyber_security]
    a = "ai_and_cyber_remote"
    b = "baikal_ai_and_cyber"
    collections = null
    conflict_resolution = "b wins"

    [storage ai_and_cyber_remote]
    type = "http"
    url = "http://www.swas.polito.it/dotnet/orari_lezione_pub/Export_ics.aspx?id_imt=236312&numcor=0&a_acc=2027&pd=1"
    read_only = true

    [storage baikal_ai_and_cyber]
    type = "caldav"
    url = "http://baikal.baikal.svc.cluster.local/dav.php/calendars/rdfilippo/ai_and_cyber_security/"
    username.fetch = ["command", "printenv", "BAIKAL_USERNAME"]
    password.fetch = ["command", "printenv", "BAIKAL_PASSWORD"]

    # ==========================================
    # FEED 3: Security Verification
    # ==========================================
    [pair security_verification]
    a = "sec_verify_remote"
    b = "baikal_sec_verify"
    collections = null
    conflict_resolution = "b wins"

    [storage sec_verify_remote]
    type = "http"
    url = "http://www.swas.polito.it/dotnet/orari_lezione_pub/Export_ics.aspx?id_imt=236325&numcor=0&a_acc=2027&pd=1"
    read_only = true

    [storage baikal_sec_verify]
    type = "caldav"
    url = "http://baikal.baikal.svc.cluster.local/dav.php/calendars/rdfilippo/security_verification_and_testing/"
    username.fetch = ["command", "printenv", "BAIKAL_USERNAME"]
    password.fetch = ["command", "printenv", "BAIKAL_PASSWORD"]

    # ==========================================
    # FEED 4: Laws and Regulations
    # ==========================================
    [pair cyber_laws]
    a = "cyber_laws_remote"
    b = "baikal_cyber_laws"
    collections = null
    conflict_resolution = "b wins"

    [storage cyber_laws_remote]
    type = "http"
    url = "http://www.swas.polito.it/dotnet/orari_lezione_pub/Export_ics.aspx?id_imt=236320&numcor=0&a_acc=2027&pd=1"
    read_only = true

    [storage baikal_cyber_laws]
    type = "caldav"
    url = "http://baikal.baikal.svc.cluster.local/dav.php/calendars/rdfilippo/cybersecurity_laws_and_regulations/"
    username.fetch = ["command", "printenv", "BAIKAL_USERNAME"]
    password.fetch = ["command", "printenv", "BAIKAL_PASSWORD"]

    # ==========================================
    # GOOGLE CALENDAR
    # ==========================================
    [pair google_work]
    a = "google_remote"
    b = "baikal_google"
    # Pull collections exclusively from Google
    collections = ["from a"]

    [storage google_remote]
    type = "google_calendar"
    token_file = "/vdirsyncer/status/google_token"
    client_id.fetch = ["command", "printenv", "GOOGLE_WORK_CLIENT_ID"]
    client_secret.fetch = ["command", "printenv", "GOOGLE_WORK_CLIENT_SECRET"]

    [storage baikal_google]
    type = "caldav"
    # Point directly to the target calendar you created in Baïkal
    url = "http://baikal.baikal.svc.cluster.local/dav.php/calendars/rdfilippo/google_work/"
    username.fetch = ["command", "printenv", "BAIKAL_USERNAME"]
    password.fetch = ["command", "printenv", "BAIKAL_PASSWORD"]
