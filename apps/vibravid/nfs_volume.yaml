apiVersion: v1
kind: PersistentVolume
metadata:
  name: vibravid-data-nfs
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  capacity:
    storage: 2Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: vibravid-nfs
  mountOptions:
    - vers=4
    - proto=tcp
  nfs:
    server: 192.168.10.101
    path: /mnt/media
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vibravid-data
  namespace: vibravid
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: vibravid-nfs
  resources:
    requests:
      storage: 2Ti
