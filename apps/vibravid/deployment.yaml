apiVersion: apps/v1
kind: Deployment
metadata:
  name: vibravid
  namespace: vibravid
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vibravid
  template:
    metadata:
      labels:
        app: vibravid
    spec:
      initContainers:
        - name: configure-vibravid
          image: alpine:latest
          command:
            - sh
            - -c
            - |
              # Install jq for JSON parsing
              apk add --no-cache jq

              # If config.json doesn't exist yet, create a valid empty skeleton
              if [ ! -f /config/config.json ]; then
                echo '{"OUTPUT": {}}' > /config/config.json
              fi

              # Use jq to update the specific keys inside the OUTPUT block
              jq '.OUTPUT.root_path = "downloads" | 
                  .OUTPUT.movie_folder_name = "Film" | 
                  .OUTPUT.serie_folder_name = "Serie" | 
                  .OUTPUT.anime_folder_name = "Serie"' \
                  /config/config.json > /config/config.tmp.json

              # Replace the old config with the updated one
              mv /config/config.tmp.json /config/config.json

              echo "config.json OUTPUT block successfully patched."
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: vibravid
          image: ghcr.io/astraelabs/vibravid:latest
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: ALLOWED_HOSTS
              value: "download.internal.fferrando.cc"
            - name: CSRF_TRUSTED_ORIGINS
              value: "https://download.internal.fferrando.cc"
            - name: VIBRAVID_VIDEO_DIR
              value: "/downloads"
            - name: VIBRAVID_CONFIG_DIR
              value: "/config"
            - name: VIBRAVID_DB_DIR
              value: "/config/db"
            - name: VIBRAVID_LOGS_DIR
              value: "/config/logs"
          volumeMounts:
            - name: media
              mountPath: /downloads
              subPath: TV
            - name: config
              mountPath: /config
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: vibravid-data
        - name: config
          persistentVolumeClaim:
            claimName: vibravid-config
