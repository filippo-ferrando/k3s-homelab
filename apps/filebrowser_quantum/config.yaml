apiVersion: v1
kind: ConfigMap
metadata:
  name: filebrowser-config
  namespace: filebrowser
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  config.yaml: |
    # unprivileged port, the Service maps 80 to it
    http:
      port: 8080
    server:
      cacheDir: /home/filebrowser/data/tmp
      sources:
        - path: /media
        - path: /data
    config:
      defaultEnabled: true
    auth:
      adminUsername: admin
