apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: filebrowser-internal
  namespace: filebrowser
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`files.internal.fferrando.cc`)
      kind: Rule
      services:
        - name: filebrowser
          port: 80
  tls:
    secretName: filebrowser-internal-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: filebrowser-public
  namespace: filebrowser
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  entryPoints:
    - cf-public
  routes:
    - match: Host(`files.fferrando.cc`)
      kind: Rule
      middlewares:
        - name: public-ratelimit
      services:
        - name: filebrowser
          port: 80
---
# Bucketed per visitor via Cf-Connecting-Ip (RemoteAddr would be the cloudflared pod).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: public-ratelimit
  namespace: filebrowser
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  rateLimit:
    average: 60
    period: 1m
    burst: 30
    sourceCriterion:
      requestHeaderName: Cf-Connecting-Ip
