apiVersion: apps/v1
kind: Deployment
metadata:
  name: filebrowser
  namespace: filebrowser
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  replicas: 1
  # ReadWriteOnce volume: the old pod must release it before the new one starts
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: filebrowser
  template:
    metadata:
      labels:
        app: filebrowser
    spec:
      # No RBAC is granted to the default SA: no reason to mount its token
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: filebrowser
          image: gtstef/filebrowser:2.1.1-beta
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: fb-config-folder
              mountPath: /home/filebrowser/data
            - name: fb-config
              mountPath: /home/filebrowser/data/config.yaml
              subPath: config.yaml
            - name: fb-media
              mountPath: /media
            - name: fb-data
              mountPath: /data
          resources:
            limits:
              memory: 5G
              cpu: "2"
            requests:
              memory: 512Mi
              cpu: "0.5"
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: fb-config-folder
          persistentVolumeClaim:
            claimName: fbq-config
        - name: fb-config
          configMap:
            name: filebrowser-config
        - name: fb-media
          persistentVolumeClaim:
            claimName: fbq-media-nfs
        - name: fb-data
          persistentVolumeClaim:
            claimName: fbq-data-nfs
