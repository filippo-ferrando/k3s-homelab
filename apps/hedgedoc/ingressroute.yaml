apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: hedgedoc-headers
  namespace: hedgedoc
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: "https"
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hedgedoc
  namespace: hedgedoc
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  entryPoints:
    - cf-public
  routes:
    - match: Host(`doc.fferrando.cc`)
      kind: Rule
      middlewares:
        - name: hedgedoc-headers
          namespace: hedgedoc
        - name: public-ratelimit
      services:
        - name: hedgedoc
          port: 3000
---
# Bucketed per visitor via Cf-Connecting-Ip (RemoteAddr would be the cloudflared pod).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: public-ratelimit
  namespace: hedgedoc
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  rateLimit:
    average: 60
    period: 1m
    burst: 30
    sourceCriterion:
      requestHeaderName: Cf-Connecting-Ip
