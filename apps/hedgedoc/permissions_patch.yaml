# Local fix for hedgedoc/hedgedoc#6946: in 1.12.2 the shared checkViewPermission()
# denies every HTTP request to private, limited and protected notes, owner included.
# Mounted over /hedgedoc/lib/permissions.js by deployment.yaml.
# REMOVE this file and its volume/volumeMount once a release ships the upstream fix.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hedgedoc-permissions-patch
  namespace: hedgedoc
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  permissions.js: |
    export const allowedPermissionValues = ['freely', 'editable', 'limited', 'locked', 'protected', 'private']

    // Two caller shapes reach this function:
    // - realtime: socket.request, user is set by passport.socketio with a boolean
    //   logged_in ({ logged_in: false } for anonymous), note.owner is the owner UUID
    // - HTTP: Express request, user is the Sequelize User (no logged_in field) or
    //   undefined, note is a Sequelize Note whose owner UUID is note.ownerId
    function isLoggedIn (req) {
      if (!req.user) {
        return false
      }
      if (typeof req.user.logged_in === 'boolean') {
        return req.user.logged_in
      }
      return typeof req.isAuthenticated === 'function' && req.isAuthenticated()
    }

    function ownerOf (note) {
      if (note.ownerId) {
        return note.ownerId
      }
      if (note.owner && typeof note.owner === 'object') {
        return note.owner.id
      }
      return note.owner
    }

    export function checkViewPermission (req, note) {
      const permission = note.permission

      // Private notes should only be readable to their owner
      if (permission === 'private') {
        const owner = ownerOf(note)
        return isLoggedIn(req) && !!owner && req.user.id === owner
      }

      // Limited and protected notes should be readable by all logged-in users
      if (permission === 'limited' || permission === 'protected') {
        return isLoggedIn(req)
      }

      // Freely, Editable and Locked notes should be readable by everyone
      if (permission === 'freely' || permission === 'editable' || permission === 'locked') {
        return true
      }

      // Invalid permission
      return false
    }
