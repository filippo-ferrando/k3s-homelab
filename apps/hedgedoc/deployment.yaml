apiVersion: v1
kind: Namespace
metadata:
  name: hedgedoc

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hedgedoc
  namespace: hedgedoc
labels:
  app: hedgedoc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hedgedoc
  template:
    metadata:
      labels:
        app: hedgedoc
  spec:
    containers:
      - name: hedgedoc
        image: quay.io/hedgedoc/hedgedoc:1.12.0
        imagePullPolicy: IfNotPresent
        ports:
          - name: http
            containerPort: 3000
            protocol: TCP
        env:
          - name: NODE_ENV
            value: production

          - name: CMD_DOMAIN
            value: doc.fferrando.cc

          - name: CMD_URL_ADDPORT
            value: "false"

          - name: CMD_PROTOCOL_USESSL
            value: "true"

          - name: CMD_DB_DIALECT
            value: postgres

          - name: CMD_DB_HOST
            value: homelab-db-rw.database.svc.cluster.local

          - name: CMD_DB_PORT
            value: "5432"

          - name: CMD_DB_DATABASE
            value: hedgedoc

          - name: CMD_DB_USERNAME
            value: hedgedoc

          - name: CMD_DB_PASSWORD
            value: hedgedoc

          - name: CMD_URL_ADDPORT
            value: false

          - name: CMD_ALLOW_ANONYMOUS
            value: false

          - name: CMD_ALLOW_ANONYMOUS_EDIT
            value: false

          - name: CMD_DEFAULT_PERMISSION
            value: private

          - name: CMD_ALLOW_EMAIL_REGISTER
            value: true

          - name: CMD_ALLOW_GRAVATAR
            value: true

        volumeMounts:
          - name: uploads
            mountPath: /hedgedoc/public/uploads

        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi

        readinessProbe:
          httpGet:
            path: /_health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10

        livenessProbe:
          httpGet:
            path: /_health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30

    volumes:
      - name: uploads
        persistentVolumeClaim:
          claimName: hedgedoc-uploads

---
apiVersion: v1
kind: Service
metadata:
  name: hedgedoc
  namespace: hedgedoc
spec:
  selector:
    app: hedgedoc
  ports:
    - name: http
      port: 3000
      targetPort: 3000
