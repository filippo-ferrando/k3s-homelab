apiVersion: apps/v1
kind: Deployment
metadata:
  name: librephoto-redis
  namespace: librephoto
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: librephoto-redis
  template:
    metadata:
      labels:
        app: librephoto-redis
    spec:
      # No RBAC is granted to the default SA: no reason to mount its token
      automountServiceAccountToken: false
      securityContext:
        # redis user of the image; numeric uid so the kubelet can verify runAsNonRoot
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:8.10.3-alpine
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - containerPort: 6379
          volumeMounts:
            # Working dir for RDB snapshots: ephemeral, as before (queue and cache only)
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: librephoto-redis
  namespace: librephoto
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  ports:
    - port: 6379
  selector:
    app: librephoto-redis
