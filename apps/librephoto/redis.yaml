apiVersion: apps/v1
kind: Deployment
metadata:
  name: librephoto-redis
  namespace: librephoto
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: librephoto-redis
  template:
    metadata:
      labels:
        app: librephoto-redis
    spec:
      # No RBAC is granted to the default SA: no reason to mount its token
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:alpine
          resources:
            requests:
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: librephoto-redis
  namespace: librephoto
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  ports:
    - port: 6379
  selector:
    app: librephoto-redis
