apiVersion: apps/v1
kind: Deployment
metadata:
  name: librephoto-backend
  namespace: librephoto
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: librephoto-backend
  template:
    metadata:
      labels:
        app: librephoto-backend
    spec:
      # No RBAC is granted to the default SA: no reason to mount its token
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: reallibrephotos/librephotos:1.3.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          env:
            - name: BASE_LOGS
              value: "/tmp/logs"
            # The image ships no .pyc files and the root filesystem is read-only
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: librephoto-secret-key
                  key: secret-key
            - name: DB_ENGINE
              value: "django.db.backends.postgresql"
            - name: DB_NAME
              value: "librephoto"
            - name: DB_HOST
              value: "homelab-db-rw.database.svc.cluster.local"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: librephoto-db-credentials
                  key: username
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: librephoto-db-credentials
                  key: password
            - name: BACKEND_HOST
              value: "*"
            - name: CSRF_TRUSTED_ORIGINS
              value: "https://photo.internal.fferrando.cc,https://photo.fferrando.cc"
            - name: REDIS_HOST
              value: "librephoto-redis"
            - name: REDIS_PORT
              value: "6379"
            - name: FRONTEND_BASE_URL
              value: "https://photo.internal.fferrando.cc"
            - name: WEB_CONCURRENCY
              value: "1"
            - name: WORKERS
              value: "1"
            - name: FEATURE_FACE_DETECTION
              value: "false"
            - name: FEATURE_FACE_CLUSTER
              value: "false"
            - name: FEATURE_IMAGE_CAPTIONING
              value: "false"
            - name: FEATURE_SCENE_CLASSIFICATION
              value: "false"
            - name: FEATURE_LLM
              value: "false"
            - name: FEATURE_REVERSE_GEOCODING
              value: "false"
          volumeMounts:
            # Logs, lock file and temp files
            - name: tmp
              mountPath: /tmp
            # STATIC_ROOT: not in the image, collectstatic fills it on every start
            - name: static
              mountPath: /code/librephotos/static
            - name: nfs-data
              mountPath: /data/filippo
              subPath: Filippo/Foto
            - name: nfs-data
              mountPath: /data/famiglia
              subPath: Famiglia/Foto
            - name: protected-media
              mountPath: /protected_media
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 4Gi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: static
          emptyDir:
            sizeLimit: 128Mi
        - name: nfs-data
          persistentVolumeClaim:
            claimName: librephoto-nfs-data
        - name: protected-media
          persistentVolumeClaim:
            claimName: librephoto-protected-media
---
apiVersion: v1
kind: Service
metadata:
  name: librephoto-backend
  namespace: librephoto
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  ports:
    - port: 8001
      targetPort: 8001
  selector:
    app: librephoto-backend
