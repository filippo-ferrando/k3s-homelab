apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: photo-internal-tls
  namespace: librephoto
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  secretName: photo-internal-tls
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
  dnsNames:
    - photo.internal.fferrando.cc
