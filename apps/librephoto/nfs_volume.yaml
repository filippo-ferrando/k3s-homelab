apiVersion: v1
kind: PersistentVolume
metadata:
  name: librephoto-nfs-data
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  capacity:
    storage: 2Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: librephoto-nfs
  mountOptions:
    - vers=4
    - proto=tcp
  nfs:
    server: 192.168.10.101
    path: /mnt/vault/data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: librephoto-nfs-data
  namespace: librephoto
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: librephoto-nfs
  resources:
    requests:
      storage: 2Ti
