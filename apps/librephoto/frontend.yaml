apiVersion: apps/v1
kind: Deployment
metadata:
  name: librephoto-frontend
  namespace: librephoto
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: librephoto-frontend
  template:
    metadata:
      labels:
        app: librephoto-frontend
    spec:
      # No RBAC is granted to the default SA: no reason to mount its token
      automountServiceAccountToken: false
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - librephoto-backend
              topologyKey: kubernetes.io/hostname
      securityContext:
        # static user of the image; numeric uid so the kubelet can verify runAsNonRoot
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: reallibrephotos/librephotos-frontend:1.3.0
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 250m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: BACKEND_HOST
              value: "librephoto-backend"
            - name: BACKEND_PORT
              value: "8001"
          ports:
            - containerPort: 3000
              name: http
---
apiVersion: v1
kind: Service
metadata:
  name: librephoto-frontend
  namespace: librephoto
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: librephoto-frontend
