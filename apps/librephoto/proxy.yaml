apiVersion: apps/v1
kind: Deployment
metadata:
  name: librephoto-proxy
  namespace: librephoto
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: librephoto-proxy
  template:
    metadata:
      labels:
        app: librephoto-proxy
    spec:
      # No RBAC is granted to the default SA: no reason to mount its token
      automountServiceAccountToken: false
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - librephoto-backend
              topologyKey: kubernetes.io/hostname
      securityContext:
        # nginx user of the image (workers already ran as it); ports start at 0 on the nodes, so 80 binds without NET_BIND_SERVICE; numeric uid so the kubelet can verify runAsNonRoot
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proxy
          image: reallibrephotos/librephotos-proxy:1.4.0
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 250m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            # nginx pid and temp files
            - name: run
              mountPath: /run
            - name: cache
              mountPath: /var/cache/nginx
            - name: protected-media
              mountPath: /protected_media
            - name: nfs-data
              mountPath: /data/filippo
              subPath: Filippo/Foto
            - name: nfs-data
              mountPath: /data/famiglia
              subPath: Famiglia/Foto
      volumes:
        - name: run
          emptyDir:
            sizeLimit: 8Mi
        - name: cache
          # Client bodies and proxied responses that overflow the in-memory buffers
          emptyDir:
            sizeLimit: 1Gi
        - name: protected-media
          persistentVolumeClaim:
            claimName: librephoto-protected-media
        - name: nfs-data
          persistentVolumeClaim:
            claimName: librephoto-nfs-data
---
apiVersion: v1
kind: Service
metadata:
  name: librephoto-proxy
  namespace: librephoto
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: librephoto-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: librephoto
spec:
  ports:
    - port: 8001
      targetPort: 8001
  selector:
    app: librephoto-backend
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: librephoto
spec:
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: librephoto-frontend
