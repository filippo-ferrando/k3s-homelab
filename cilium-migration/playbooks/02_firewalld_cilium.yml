---
# Safe to run anytime before or during the migration -- purely additive,
# opens ports on the trusted-zone-adjacent host firewall, no service restarts.
- name: Open firewalld ports required by Cilium and Hubble
  hosts: k3s_cluster
  become: true
  tasks:
    - name: Populate service facts
      ansible.builtin.service_facts:

    - name: Allow Cilium/Hubble ports in Firewalld
      ansible.posix.firewalld:
        port: "{{ item }}"
        permanent: true
        immediate: true
        state: enabled
      loop:
        - "4240/tcp"   # cilium-health cross-node connectivity checks
        - "4244/tcp"   # Hubble relay
        - "4245/tcp"   # Hubble relay mTLS
        - "9964/tcp"   # cilium-operator metrics
        - "9962/tcp"   # cilium-agent metrics
        - "9965/tcp"   # Hubble metrics
      when:
        - "'firewalld.service' in ansible_facts.services"
        - ansible_facts.services['firewalld.service'].state == 'running'
