apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: hubble-auth
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  basicAuth:
    secret: hubble-auth-secret
# hubble-auth-secret is NOT created here -- it needs a SealedSecret generated
# against the live cluster's public key, the same way
# infrastructure/longhorn/sealed-longhorn-auth.yaml was created. Follow
# notes/kubeseal_secrets.md to produce hubble-auth-secret and add the
# resulting sealed-hubble-auth.yaml alongside these manifests before
# committing to infrastructure/cilium/.
